<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Component</title>
    <!--bootstrap library-->
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <!--react library-->
    <script src="./node_modules/react/umd/react.development.js"></script>
    <script src="./node_modules/react-dom/umd/react-dom.development.js"></script>
    <script src="./node_modules/@babel/standalone/babel.js"></script>
    <style type="text/css">
        body{
            background-image: url("public/images/netflix-banner.jpg");
            background-size: cover;
        }
        .bg-shade{
            background-color: rgba(0,0,0,0.4);
            height: 100vh;
        }
        .article-title{
            font-size: 50px;
            font-weight: bold;
            text-align: center;
    
        }
        .article-subtitle{
            display: flex;
            justify-content: center;
            font-size: 20px;
        }
    </style>
    <!--Virtual dom-->
    <script type="text/babel">
       function NetflixIndex(){
        return(
            <div className="bg-shade">
                <Header/>
                <Article/>
                </div>
        )
       }
       function Header(){
        return(
            <div className="d-flex justify-content-between p-4">
                <div className="fs-1 text-danger fw-bold">
                    NETFLIX
                    </div>
                <div className="d-flex justify-content-between gap-3">
                    <div>
                        <select className="form-select">
                            <option>ENGLISH</option>
                            <option>HINDI</option>
                            <option>TELUGU</option>
                            <option>MALAYALAM</option>
                            </select>
                        </div>
                    <div><button class="btn btn-danger">SignIn</button></div>
                    </div>
                </div>
        )
       }
       function Article(){
        return(
            <div className="text-white d-flex h-100 justify-content-center mt-5">
                <div>
                    <div className="article-title">Unlimited movies,<br/>
                     shows, and more</div>
                     <div className="article-subtitle">
                        Starts at ₹149. Cancel at anytime.
                        </div>
                        <NetflixMain/>
                    </div>
                </div>
        )
       }
       function NetflixMain(){
        return(
            <div>
                <div className="mt-5">Ready to watch? Enter Your email to create or restart your membership.</div>
                <div className="d-flex justify-content-between gap-2 mt-2">
                    <input type="text" placeholder="Enter your Gmail" className="form-control"/>
                    <button className="btn btn-danger" style={{width:'250px'}}>Get Started</button>
                    </div>
                </div>
        )
       }
        const root=ReactDOM.createRoot(document.getElementById("root"));
        root.render(<NetflixIndex/>)
    </script>
</head>
<body>
    <noscript>Please enable javascript in your browser</noscript>
    <div id="root"></div>
</body>
</html>
