<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Page</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: linear-gradient(135deg, rgb(71, 183, 227), rgb(133, 53, 133));
        }
        form{
            border: 1px solid white;
            width: 550px;
            height: 530px;
             padding: 30px;
             border-radius: 10px;
             background-color: white;
        

        }
        .form-container{
            display: grid;
            grid-template-columns: 6fr 6fr;
           
        }
        h1{
            margin-bottom: -5px;
            margin-top: -5px;
        }
        label{
            display: block;
            margin-top: 20px;
            margin-bottom: 10px;
        font-weight: 500;
        color: rgb(42, 40, 40);
        font-weight: 500;
        font-size: 18px
       
        }
        input{
           border: 1px solid rgb(194, 188, 188);
            box-shadow: 2px 2px 2px gray;
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            font-size: 16px;
        }
   .radio-container{
    margin-top: 50px;
   }    
.radio-item {
    display: flex;
    gap: 80px;
    align-items: center;
}

.radio {
    display: flex;
    align-items: center;
    gap: 6px;
}

.radio input[type="radio"] {
    width: 16px;
    height: 16px;
    margin: 0;
    padding: 0;
    box-shadow: none;
    border: none;
}

.radio label {
    margin: 0;
    display: inline;
    font-weight: 500;
    color: rgb(42, 40, 40);
}
button{
    width: 100%;
   background-image: linear-gradient(to right, rgb(71, 183, 227), rgb(133, 53, 133));
    padding: 5px;
    border-radius: 10px;
    margin-top: 50px;
}
.form-field1{
    margin-left: 10px;
}

    </style>
</head>
<body>
    <form method="get">
        <h1>Registration</h1>
        <div class="form-container">
         <div class="form-field">
<div class="form-item">
    <label>Full Name</label>
    <input type="text" name="fullname" placeholder="Enter Your Name" required>
</div>
<div class="form-item">
    <label for="email">Email</label>
    <input type="text" name="email" placeholder="Enter Your Email">
</div>
<div class="form-item">
    <label for="password"> Confirm Password</label>
    <input type="password" name="password" placeholder="Enter Your Password">
</div>
         </div>
         <div class="form-field1">
<div class="form-item">
    <label for="username">Username</label>
    <input type="text" name="username" placeholder="Enter Your Username">
</div>
<div class="form-item">
    <label for="phnumber">Phone Number</label>
    <input type="number" name="phnumber" placeholder="Enter Your Number">
</div>
<div class="form-item">
    <label for="password"> Confirm Password</label>
    <input type="password" name="password" placeholder="Confirm Your Password">
</div>
         </div>
        </div>
        <div class="radio-container">
         <h3>Gender</h3>
         <div class="radio-item">
<div class="radio"><input type="radio" id="male" name="gender"><label for="gender">Male</label></div>
<div class="radio"><input type="radio" id="female" name="gender"><label for="gender">Female</label></div>
<div class="radio"><input type="radio" id="others" name="gender"><label for="gender">Others</label></div>

         </div> 
          <button type="submit">Register</button>
       </div>
       
    </form>
</body>
</html>
