<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Page</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
        }
        form{
            border: 1px solid black;
            width: 450px;
             padding: 20px;
             border-radius: 10px;
        

        }
        .form-container{
            display: grid;
            grid-template-columns: 6fr 6fr;
           
        }
        label{
            display: block;
            margin-bottom: 5px;
        }
       
.radio-item{
    display: flex;
    gap: 60px;
  
}
.radio{
    display: flex;
    
}
button{
    width: 100%;
    background-image: linear-gradient(to right,rgb(87, 87, 234),purple);
    padding: 5px;
    border-radius: 10px;
    margin-top: 30px;
}
    </style>
</head>
<body>
    <form method="get">
        <div class="form-container">
         <div class="form-field">
<div form-item>
    <label>Full Name</label>
    <input type="text" name="fullname">
</div>
<div form-item>
    <label for="email">Email</label>
    <input type="text" name="email">
</div>
<div form-item>
    <label for="password"> Confirm Password</label>
    <input type="password" name="password">
</div>
         </div>
         <div class="form-field">
<div form-item>
    <label for="username">Username</label>
    <input type="text" name="username">
</div>
<div form-item>
    <label for="phnumber">Phone Number</label>
    <input type="number" name="phnumber">
</div>
<div form-item>
    <label for="password"> Confirm Password</label>
    <input type="password" name="password">
</div>
         </div>
        </div>
        <div class="radio-container">
         <h3>Gender</h3>
         <div class="radio-item">
<div class="radio"><input type="radio" name="gender"><label for="gender">Male</label></div>
<div class="radio"><input type="radio" name="gender"><label for="gender">Female</label></div>
<div class="radio"><input type="radio" name="gender"><label for="gender">Others</label></div>

         </div> 
          <button>Register</button>
       </div>
       
    </form>
</body>
</html>
