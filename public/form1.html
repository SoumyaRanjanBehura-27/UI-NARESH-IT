<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            margin-top: 100px;
        }
        form{
border: 1px solid black;
width: 350px;
padding: 20px;
border-radius: 10px;
        }
        .form-field{
           margin-top: 20px;
        }
        label{
             display: block;
             font-size: 20px;
             font-weight: bold;
             margin-bottom: 10px;
        }
        input{
            border: 1px solid  black;
            border-radius: 10px;
            width: 100%;
            height: 25px;
            font-size: 20px;
            padding: 5px;
        }
        button{
            margin-top: 30px;
            display: block;
            background-color: rgb(45, 45, 213);
            color: white;
            padding: 5px ;
            width: 250px;
            border-radius: 10px;
            height: 35px;
            margin: auto;
            margin-top: 30px;
        }
        button:hover{
            background-color: rgb(21, 223, 21);
            padding: 10px;
            font-size: 15px;
            cursor:pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <form method="get">
        <div>
        <div class="form-field">
            <label for="userid">User ID</label>
            <input type="text" name="userid" placeholder="Mobile number or Email Addres" required autofocus>

        </div>
        
        <div class="form-field">
<label for="password">Password</label>
<input type="password" name="password" placeholder="Password">
        </div>
        <button>Submit</button>
        <button>Register</button>
    </div>
    </form>
</body>
</html>
