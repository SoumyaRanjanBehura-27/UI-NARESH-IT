<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form page</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: linear-gradient(135deg, rgb(79, 177, 210), rgb(127, 13, 127));
        }
        form{
            border: 1px solid black;
            height: 400px;
            width: 300px;
            padding: 30px;
            border-radius: 5px;
            background-color: white;
        }
        label{
            display: block;
            margin-top: 10px;
            color: rgb(98, 93, 93);
        }
        input{
            border: 1px solid gray;
            border-top: none;
            border-left: none;
            border-right: none;
            width: 100%;
            padding: 5px;  
        }
        input:focus{
            outline: none;
        }
        button{
            margin-top: 40px;
            width: 100%;
            border-radius: 10px;
            padding: 10px;
            font-size: 18px;
            font-weight: 600;

        }
        h1{
            display: flex;
            justify-content: center;
            border-bottom: 1px solid black;
            margin-left: -20px;
            margin-right: -20px;
            padding-bottom: 20px;
            margin-top: -10px;
        }
        .login{
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 30px;
        }
        a:link{
text-decoration: none;
 
        }
        a:active{
            color: rgb(60, 147, 201);
        }
a:visited{
   color: rgb(60, 147, 201);
}
    </style>
</head>
<body>
  <form method="get">
    <h1>Register</h1>
    <div>
        <div class="form-field"><label for="name">Name</label>
<input type="text" name="name" required autofocus>
        </div>
         <div class="form-field">
            <label for="email">Email</label>
<input type="text" name="email">
        </div>
         <div class="form-field">
            <label for="password">Password</label>
<input type="password" name="password">
        </div>
         <div class="form-field">
            <label for="password">Confirm your Password</label>
<input type="password" name="password">
        </div>
        <button type="submit">sign up</button>
        <div class="login">
            <div>Have an account?</div>
            <div><a href="#">Login Here</a></div>
        </div>
    </div>
  </form>
</body>
</html>
