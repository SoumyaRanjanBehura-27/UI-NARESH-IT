<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <title>Problems Leetcode</title>
    <style>
        body{
            background-color: #f5f5f5;
        }
        header{
display: flex;
justify-content: space-between;
padding-left: 10px;
padding-right: 10px;
padding: 5px;
border-radius: 5px;
align-items: center;
        }

        .header-left{
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .js_img{
            padding: 5px;
            border-radius: 5px;
           display: flex;
           justify-content: center;
           align-items: center;
           margin-left: 20px;
        }
        .js_img:hover{
            background-color:  rgb(218, 216, 216);
        }
        .bi-chevron-left:hover{
             background-color:  rgb(218, 216, 216);
             padding: 8px;
        }
         .bi-chevron-right:hover{
             background-color:  rgb(218, 216, 216);
             padding: 8px;
        }
        .bi-shuffle:hover{
             background-color:  rgb(218, 216, 216);
             padding: 8px;
        }
        .js_img img{
            background-color: white;
           border-radius: 5px;
        }
        .bi-play-fill, .bi-cloud-arrow-up, .bi-sticky, .bi-person-plus{
            background-color: rgb(218, 216, 216);
            border-radius: 5px;
            padding: 5px;
            color: rgb(90, 87, 87);
        }
        .bi-bug{
            background-color: rgb(218, 216, 216);
            color: orange;
            border-radius: 5px;
            padding: 5px;
        }
        .bi-stopwatch{
            color: blue;
            background-color: rgb(218, 216, 216);
            border-radius: 5px;
            padding: 5px;
        }
        .header-mid{
            display: flex;
           gap: 3px;
           font-size: 18px;
        }
        .bi-sticky{
            margin-left: 10px;
        }
        .bi-cloud-arrow-up{
            color: rgb(64, 233, 64);
          
        }
        .header-right{
            display: flex;
            align-items: center;
        }
        .premium{
            background-color: #fff3e0;
            color: #f59e0b;
            padding: 5px;
            border-radius: 10px;
            margin-left: 20px;
        }
        .bi-gear, .bi-fire, .bi-columns-gap{
            margin-right: 20px;
        }
        .bi-columns-gap:hover{
background-color:  rgb(218, 216, 216);
             padding: 6px;
        }
         .bi-gear:hover{
background-color:  rgb(218, 216, 216);
             padding: 6px;
        }
         .bi-fire:hover{
background-color:  rgb(218, 216, 216);
             padding: 6px;
        }
        .bi-stopwatch{
            margin-right: 2px;
        }
        .bi-person-plus{
            margin-right: 15px;
        }
        main{
            height: 660px;
            display:grid;
            grid-template-columns: 6fr 6fr;
            gap: 5px;

        }
        .panel-left{
            background-color: white;
            border: 1px solid rgb(76, 73, 73);
            border-radius: 10px;
        }
        .panel-right{
            background-color: white;
            border: 1px solid rgb(83, 81, 81);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header>
       <div class="header-left">
        <span><img src="../images/leetcode_logo.png" width="30px" height="30px"></span>
        <span class="js_img"><img src="../images/js_logo.png" width="30px" height="30px">&nbsp;Javscript 30 day challange</span>
        <span class="bi bi-chevron-left"></span>
        <span class="bi bi-chevron-right"></span>
        <span class="bi bi-shuffle"></span>
        <span></span>
       </div>
       <div class="header-mid">
        <span class="bi bi-bug"></span>
        <span class="bi bi-play-fill"></span>
        <span class="bi bi-cloud-arrow-up">submit</span>
        <span class="bi bi-sticky"></span>
       </div>
       <div class="header-right">
        <span class="bi bi-columns-gap"></span>
        <span class="bi bi-gear"></span>
        <span class="bi bi-fire"> 0</span>
        <span class="bi bi-stopwatch"></span>
        <span class="bi bi-person-plus"></span>
        <span class="bi bi-person-circle"></span>
        <span class="premium">Premium</span>
       </div> 
    </header>
    <main>
<div class="panel-left">

</div>
<div class="panel-right">

</div>
    </main>
</body>
</html>
