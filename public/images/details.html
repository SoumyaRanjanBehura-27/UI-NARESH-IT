<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETAILS</title>
    <style>
        .detail{
            display: grid;
            grid-template-columns: 4fr 4fr 4fr;
            gap: 10px;
        }
       details{
            border: 1px solid black;
            background-color: aqua;
        }
        summary{
            border: 1px solid black;
            width: 200px;
            margin: 10px;
            padding: 5px;
            background-color: crimson;
        }
        summary~div{
           border: 1px solid black;
            width: 200px;
            margin: 10px; 
            padding: 5px;
            background-color: rgb(10, 202, 138);
        }
    </style>
</head>
<body>
<div class="detail">
        <details>
        <summary>ELECTRONICS</summary>
        <div>Telivision</div>
        <div>Laptop</div>
        <div>Mobile</div>
        <div>AC</div>
    </details>
    <details>
         <summary>FOOTWEAR</summary>
        <div>Casual</div>
        <div>Sneakers</div>
        <div>Sports</div>
        <div>Loffers</div>
    </details>
    <details>
        <summary>SUITCAE</summary>
        <div>HRX</div>
        <div>Safari</div>
        <div>American Tourister</div>
        <div>Sky Bags</div>
    </details>
</div>
</body>
</html>
