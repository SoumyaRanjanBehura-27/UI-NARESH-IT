<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <title>login form</title>
</head>
<body>
    <header class="d-flex justify-content-between align-items-center border border-1 border-black p-2 bg-danger text-white rounded rounded-2 ">
       <div class="d-flex align-items-center"><span class="bi bi-bag fs-5 me-1"></span><h1>SHOPKART</h1></div>
       <div>
        <span><a href="#" class="text-decoration-none text-white">Home</a></span>
        <span class="mx-4"><a href="#" class="text-decoration-none text-white">About</a></span>
        <span><a href="#" class="text-decoration-none text-white">Blog</a></span>
        <span class="mx-4"><a href="#" class="text-decoration-none text-white">Help</a></span>
       </div>
       <div class="d-flex justify-content-between">
       <div>
        <button class="btn btn-warning">cart <span class="bi bi-cart4"></span></button>
       </div>
       <div>
        <button class="mx-4 btn btn-primary">login</button>
       </div>
       <div>
        <button class="btn btn-success">Account</button>
       </div>
       </div>
    </header>
    <section>
        <div class="d-flex justify-content-around align-items-center">
        
               <ul class="list-unstyled list-group list-group-horizontal mt-4 ">
            <li class="list-group-item list-group-item-danger">Group-1</li>
            <li class="list-group-item list-group-item-primary">Group-2</li>
            <li class="list-group-item list-group-item-success">Group-3</li>
            <li class="list-group-item list-group-item-warning">Group-4</li>
        </ul>
         
            <ul class="breadcrumb mt-4"  style="--bs-breadcrumb-divider: '>';">
                <li class="breadcrumb-item text-danger">Electronics</li>
                <li class="breadcrumb-item text-primary">Mobile</li>
                <li class="breadcrumb-item text-success">Samsung</li>
                <li class="breadcrumb-item text-warning">S26 ultra</li>
            </ul>
        </div>
    </section>
    <section>
          <div class="d-flex justify-content-center mt-5">
             <form class="border border-1 p-4 rounded border-black">
               <div>
                <label for="fullname" class="mt-2 mb-1">User ID</label>
                <input type="text" class="form-control" name="fullname" placeholder="Enter your UserID">
               </div>
               <div>
                <label for="mail" class="mt-2 mb-1">Email</label>
                <input type="email" class="form-control" name="mail" placeholder="abc@gmail.com">
               </div>
               <div>
                <label for="mobile" class="mt-2 mb-1">Mobile No.</label>
                <input type="text" class="form-control" name="mobile" placeholder="+91 89176XXXXX">
               </div>
               <div>
                <label for="password" class="mt-2 mb-1">Enter Password</label>
                <input type="password" class="form-control" name="password" placeholder="password">
               </div>
               <div>
                <label for="password" class="mt-2 mb-1">Confirm Password</label>
                <input type="password" class="form-control" name="password" placeholder=" Confirm password">
               </div>
               <div class="d-flex justify-content-center gap-1 mt-2 mb-2">
                <input type="checkbox" class="form-check-input" name="terms"><label>I agree with all terms and conditions</label>
               </div>
           <div class="d-flex justify-content-center gap-5 mb-2">
             <button type="submit" class="btn btn-primary w-50">Login</button>
            <button type="reset" class="btn btn-danger w-50">Reset</button>
           </div>
            <div class="d-flex justify-content-center gap-2">
                <span>Have an account ? </span>
                <span><a href="#" class="text-decoration-none text-warning">Signup</a></span>
             </form> 
          </div>
        
    </section>
</body>
</html>
