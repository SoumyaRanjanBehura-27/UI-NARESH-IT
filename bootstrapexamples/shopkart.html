<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <title>SHOPKART</title>
</head>
<body>
    <header>
        <!--nav section-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark w-100">
           <div class="container-fluid">
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand fs-1"><span class="bi bi-bag fs-1 me-1"></span>SHOPKART</span>
           <div class="navbar-collapse collapse" id="menu">
            <ul class="navbar-nav">
               <li class="nav-item"><a class="nav-link">HOME</a></li>
               <li class="nav-item"><a class="nav-link">ABOUT</a></li>
               <li class="nav-item"><a class="nav-link">HELP</a></li>
               <li class="nav-item"><a class="nav-link">ACCOUNT</a></li>
            </ul>
          <div class="d-flex justify-content-between w-100">
              <div class="input-group ms-4" style="max-width: 350px;">
                <input type="text" class="form-control" placeholder="search">
                <button class="btn btn-warning"><span class="bi bi bi-search"></span></button>
                 
            </div>
            <!--button section-->
            <div class="d-flex justify-content-between gap-4">
                <buttton class="btn btn-warning d-flex">cart<span class="bi bi-cart4"></span></buttton>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#login">Login</button>
                <div class="dropdown" data-bs-theme="dark">
                <button data-bs-toggle="dropdown" class="dropdown-toggle btn btn bg-success">Account</button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li class="dropdown-item"><span class="dropdown-item-text"><a><span class="bi bi-person-fill-gear"></span>your Account</a></span></li>
                  <li class="dropdown-item"><span class="dropdown-item-text"><a><span class="bi bi-map-fill"></span>Saved Address</a></span></li>
                  <li class="dropdown-item"><span class="dropdown-item-text"><a><span class="bi bi-heart-fill"></span>Whishlist</a></span></li>
                  <li class="dropdown-divider"></li>
                  <li class="dropdown-item"><span class="dropdown-item-text"><a><span class="bi bi-lock"></span>Logout</a></span></li>
                </ul>
                </div>
            </div>
          </div>
           </div>
           </div>
        </nav>
    </header>
    <!--modal section-->
    <section>
        <div class="modal fade" id="login">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Login here !</h2>
                        <button class="btn btn-close" data-bs-toggle="modal" data-bs-dismiss="#login"></button>
                    </div>
                    <div class="modal-body">
                        <form method="get">
                            <div>
                                <label for="fullname" class="form-label">Enetr your Name</label>
                                <input type="text" class="form-control" name="fullname" placeholder="Your name">
                            </div>
                            <div>
                                <label for="email" class="form-label">Enter your E-mail</label>
                                <input type="email" class="form-control" name="email" placeholder="enter your email @gamil.com">
                            </div>
                            <div>
                                <label for="mobile" name="mobile">Mobile No.</label>
                                <input type="text" name="mobile" class="form-control" placeholder="+91 11111 XXXXX">
                            </div>
                            <div>
                                <label for="password" class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="password XXXX">
                            </div>
                            <div class="form-switch mt-2">
                                <input type="checkbox" name="terms" class="form-check-input"> <label for="terms" class="form-check-label ms-1">I agree in all the terms and conditions</label>
                            </div>
                           <div class="d-flex justify-content-center">
                             <button class="btn btn-warning mt-4 w-75 rounded rounded-pill" type="submit">SignUp</button>
                           </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!--carousel section-->
    <section>
        <div class="carousel carousel-fade" data-bs-ride="carousel" id="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../public/images/caro1.jpg" class="w-100" style="height: 400px;">
                </div>
                <div class="carousel-item">
                     <img src="../public/images/caro2.png"  class="w-100" style="height: 400px;">
                </div>
                <div class="carousel-item">
                     <img src="../public/images/caro3.jpg"  class="w-100" style="height: 400px;">
                </div>
                <div class="carousel-item">
                     <img src="../public/images/caro4.jpg"  class="w-100" style="height: 400px;">
                </div>
                <div class="carousel-item">
                     <img src="../public/images/caro5.png"  class="w-100" style="height: 400px;">
                </div>
            </div>
            <button class="carousel-control-prev" data-bs-slide="next" data-bs-target="#carousel"><span class="carousel-control-prev-icon"></span></button>
            <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#carousel"><span class="carousel-control-next-icon"></span></button>
            <div class="carousel-indicators">
                <button class="active" style="width: 20px; height: 20px; border-radius: 100%;" data-bs-slide-to="0" data-bs-target="#carousel"></button>
                <button style="width: 20px; height: 20px; border-radius: 100%;" data-bs-slide-to="1" data-bs-target="#carousel"></button>
                <button style="width: 20px; height: 20px; border-radius: 100%;" data-bs-slide-to="2" data-bs-target="#carousel"></button>
                <button style="width: 20px; height: 20px; border-radius: 100%;" data-bs-slide-to="3" data-bs-target="#carousel"></button>
                <button style="width: 20px; height: 20px; border-radius: 100%;" data-bs-slide-to="4" data-bs-target="#carousel"></button>
            </div>
        </div>
    </section>
    <section>
        <div class="nav nav-tabs d-flex justify-content-around bg-danger-subtle">
            <span class="nav-item"><a class="nav-link">Mens</a></span>
            <span class="nav-item"><a class="nav-link">Womens</a></span>
            <span class="nav-item"><a class="nav-link">Kids</a></span>
            <span class="nav-item"><a class="nav-link">Others</a></span>
        </div>

            <div class="tab-content">
                <div class="tab-pane"></div>
            </div>

    </section>
</body>
</html>
