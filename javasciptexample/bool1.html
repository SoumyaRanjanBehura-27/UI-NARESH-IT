<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <style>

        dialog {

            width: 350px;

            font-family: Arial;

            border:1px solid gray;

            border-radius: 10px;

            box-shadow:5px 5px 2px black;

            background-color: rgba(255,255,255,0.9)

        }

        .dialog-header {

            font-size: 20px;

            font-weight: bold;

            display: flex;

            flex-direction: row;

            justify-content: space-between;

            margin-bottom: 20px;

        }

        .dialog-body {

            padding: 30px;

        }

        .control {

            border:1px solid gray;

            padding: 20px;

            margin-bottom: 10px;

            margin-top: 10px;

            border-radius: 10px;

            display: flex;

            flex-direction: row;

            justify-content: space-between;

        }

        .dialog-footer {

            display: flex;

            flex-direction: row;

            justify-content: end;

            padding-left: 30px;

            padding-right: 30px;

        }

        .btn-submit {

            background-color: blue;

            color:white;

            padding: 10px;

            width: 100px;

            text-align: center;

            border-radius: 10px;

        }

        .bi-headset {

            position: fixed;

            bottom: 50px;

            right: 10px;

            font-size: 60px;

            border-radius: 100%;

            background-color: blue;

            color:white;

            border: none;

            padding: 10px;

        }

        .bi-headset:hover {

            cursor: grab;

        }

        .bi-x-lg:hover{

            cursor: grab;

        }

    </style>

    <script>

        function CallClick(){

            document.querySelector("dialog").open = true;

        }

        function CloseClick(){

            document.querySelector("dialog").open = false;

        }

        function ToggleAds(){

            var chkAds = document.getElementById("chkAds");

            if(chkAds.checked===true){

                document.querySelector("aside").style.display = "block";

            } else {

                document.querySelector("aside").style.display = "none";

            }

        }

    </script>

</head>

<body>

    <input type="checkbox" id="chkAds" onchange="ToggleAds()"> <label> Show Ads</label>

    <aside style="display: none;">

        <h3>Ads</h3>

        <img src="../public/Images/Data_Sci.jpg" width="100" height="100"> 

    </aside>

    <dialog>

        <section class="dialog-header">

            <div>Talk to Advisor Form</div>

            <div onclick="CloseClick()" class="bi bi-x-lg"></div>

        </section>

        <section class="dialog-body">

            <div class="control"> Full Name</div>

            <div class="control"> Mobile Number</div>

            <div class="control"> Email Address</div>

            <div class="control"> Select Course <span class="bi bi-chevron-down"></span> </div>

        </section>

        <section class="dialog-footer">

            <div class="btn-submit">Submit</div>

        </section>

    </dialog>

    <button onclick="CallClick()" class="bi bi-headset"></button>

</body>

</html>
