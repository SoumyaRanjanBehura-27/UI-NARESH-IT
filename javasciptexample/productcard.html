<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
     <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    
<style type="text/css">
    .card {
        width: 200px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0px 3px 8px gray;
        transition: 0.3s;
    }
    .card:hover {
        transform: scale(1.05);
        box-shadow: 0px 6px 15px gray;
    }
    .card-img-top img {
        object-fit: contain;
    }
    .card-header {
        background-color: lightblue;
        font-weight: bold;
        text-align: center;
    }
    .card-body {
        background-color: #f8f9fa;
        padding: 15px;
    }
    .card-footer {
        background-color: white;
        text-align: center;
        color: #198754;
    }
</style>

    <script type="text/javascript">
        function Loadproducts(){
            fetch(`../data/product.json`)
            .then(function(response){
                return response.json();
            })
            .then(function(products){
                for(var product of products){
                var div=document.createElement("div");
                div.className="card m-3 p-2";
                div.style.width="300px";
                div.innerHTML=`
                <div class="card-img-top">
                    <img src="${product.photo}" width="280" height="300">
                    </div>
                <div class="card-header fs-5 fw-bold">
                    ${product.name}
                    </div>
                <div class="card-body  d-flex justify-content-between fw-bold">
                   <span>${product.price}</span
                   <span> ${product.stock}</span>
                    </div>
                <div class="card-footer  d-flex justify-content-between fw-bolder">
                  <span> ${ product.rating.rate}</span> 
                  <span>[${product.rating.count}]</span>

                `;
                document.getElementById("lblcard").appendChild(div);
                }
            })
            .catch(function(error){
                alert(error);
            })
        }

    </script>
</head>
<body class="container-fluid">
    <div class="d-flex justify-content-around mt-2">
        <h2>Product Details</h2>
        <button class="btn btn-primary" onclick="Loadproducts()">Load Products</button>
    </div>
    <div class="d-flex flex-wrap" id="lblcard">

    </div>
</body>
</html>
