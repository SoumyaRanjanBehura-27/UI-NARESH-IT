<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt</title>
     <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <style type="text/css">
        .bi-headset{
            background-color: blueviolet;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 50px;
            margin-top: 400px;
            margin-left: 1200px;
        }
        .bi-headset:hover{
            cursor: pointer;
        }
        dialog{
            width: 400px;
            border: 1px solid black;
            border-radius: 10px;
            box-shadow: 5px 5px 2px grey;
        }
        .btn-close:hover{
        cursor: pointer;
        }
    </style>
    <script type="text/javascript">
        function addfile(){
            foldername=prompt("Enter folder name: ");
            folders=document.getElementById("folders");
            if(foldername===null){
                alert("you are cancelled");
            }
            else if(foldername===""){
                alert("please provide a folder name !");
            }else{
             folders.innerHTML +=`<li class='bg-primary-subtle p-1 rounded rounded-2 d-flex justify-content-between ms-3'><span><span class='bi bi-folder mx-1 fs-5'></span> <span class='fs-4'><b> ${foldername} </b></span> </span><span class='bi bi-trash text-danger mx-1 fs-5'></span></li><br>`;
            }
        }
        function clearfile(){
            document.getElementById("folders").innerHTML="";
        }
        function btnclick(){
      document.getElementById("dialogopen").open=true;
        }
        function closeclick(){
            document.getElementById("dialogopen").open=false;
        }
    </script>
</head>
<body class="container-fluid d-block justify-content-center mt-5">
    <div>
        <button class="btn btn-success mx-4" onclick="addfile()"><span class="bi bi-folder-plus me-1"></span>Add file</button>
        <button class="btn btn-outline-danger" onclick="clearfile()"><span class="bi bi-trash-fill me-1"></span>Clear All</button>
    </div>
    <ul class="mt-3 w-25 list-unstyled" id="folders">

    </ul>
    <section>
        <dialog id="dialogopen">
           <div class="dialog-header d-flex justify-content-between align-items-center">
            <h3>Talk to Advatisors</h3>
            <button class="btn btn-close" onclick="closeclick()"></button>
           </div>
           <div class="dialog-body">
            <form>
                 <div>
                <input type="text" class="form-control mt-3" placeholder="Full Name">
             </div>
             <div>
                <input type="text" class="form-control my-3" placeholder="Mobile Number">
             </div>
             <div>
                <input type="email" class="form-control mb-3" placeholder="Email Address">
             </div>
             <div>
                <select class="form-select mb-3">
                    <option>Select course</option>
                    <option>Python Fullstack</option>
                    <option>Java Fullstack</option>
                    <option>.Net Fullstack</option>
                </select>
             </div>
           </div>
           <div class="dialog-footer">
            <button class="btn btn-primary float-end">Submit</button>
           </div>
            </form>
        </dialog>
        <button class="bi bi-headset" onclick="btnclick()"></button>
    </section>
</body>
</html>
