<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <title>Dummyjson cards</title>
    <script type="text/javascript">
        function bodyload(){
            fetch(`https://dummyjson.com/products`)
            .then(function(response){
                return response.json();
            })
            .then(function(object){
                object.products.map(function(product){
                   var div = document.createElement("div");
div.className = "card m-2 border-0 shadow-sm rounded-4 overflow-hidden h-100";
div.style.width = "260px";

// Calculate original price based on discount percentage
const originalPrice = (product.price / (1 - product.discountPercentage / 100)).toFixed(2);

div.innerHTML = `
  <!-- Image Container with Floating Badges -->
  <div class="position-relative bg-light text-center p-3">
    ${product.discountPercentage ? `<span class="badge bg-danger position-absolute top-0 start-0 m-3 rounded-pill">-${product.discountPercentage}%</span>` : ''}
    <span class="badge ${product.stock > 0 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'} position-absolute top-0 end-0 m-3 rounded-pill fs-7">
      ${product.availabilityStatus}
    </span>
    <img src="${product.images?.[0] || product.thumbnail}" class="img-fluid object-fit-contain" style="height: 180px;" alt="${product.title}">
  </div>

  <!-- Card Body -->
  <div class="card-body d-flex flex-column p-3">
    <div class="text-uppercase text-muted fw-bold small mb-1">${product.brand || product.category}</div>
    <h6 class="card-title text-truncate fw-semibold mb-2" title="${product.title}">${product.title}</h6>
    
    <!-- Rating -->
    <div class="d-flex align-items-center mb-2">
      <span class="badge bg-warning text-dark me-1">★ ${product.rating.toFixed(1)}</span>
      <small class="text-muted">(${product.reviews?.length || 0})</small>
    </div>

    <!-- Pricing -->
    <div class="mt-auto pt-2 d-flex align-items-baseline gap-2">
      <span class="fs-5 fw-bold text-dark">$${product.price}</span>
      ${product.discountPercentage ? `<span class="text-muted text-decoration-line-through small">$${originalPrice}</span>` : ''}
    </div>
  </div>

  <!-- Card Footer / Actions -->
  <div class="card-footer bg-white border-0 p-3 pt-0">
    <button class="btn btn-primary w-100 rounded-pill fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5zM3.14 5l1.25 5h8.22l1.25-5H3.14zM5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
      </svg>
      Add to Cart
    </button>
  </div>
`;
                    document.querySelector("body").appendChild(div);
                })
            })
        }
    </script>
</head>
<body class="container-fluid d-flex flex-wrap" onload="bodyload()">
    <div></div>
</body>
</html>
