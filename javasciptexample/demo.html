<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

    <script>
        function LoadRecipie(id){

            document.getElementById("instructions").innerHTML = "";

            fetch(`https://dummyjson.com/recipes/${id}`)

            .then(function(response){

                 return response.json();

            })

            .then(function(recipe){

                document.getElementById("lblTitle").innerHTML = recipe.name;

                document.getElementById("imgPreview").src = recipe.image;

                document.getElementById("details").innerHTML = `

                   <span class="bi bi-clock"> Preperation Time : ${recipe.prepTimeMinutes} min </span>

                

                `;

                recipe.instructions.map(function(instruction){

                     var li = document.createElement("li");

                     li.className = "list-group-item list-group-item-light my-1";

                     li.innerHTML = `${instruction}`;

                     document.getElementById("instructions").appendChild(li);

                })

            })

        }



        function bodyload(){

            LoadRecipie(1);

        }

        var recipeId = 1;

        function NextClick(){

            recipeId++;

            LoadRecipie(recipeId);

        }

        function PrevClick(){

            recipeId--;

            LoadRecipie(recipeId);

        }

    </script>

</head>

<body class="container-fluid row"  onload="bodyload()">
    <div class="card w-50 col-6 p-2 ms-3">
        <div class="card-header text-center fw-bold fs-5">
            <div id="lblTitle"></div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-1 d-flex flex-column justify-content-center align-items-center">
                    <button onclick="PrevClick()" class="btn btn-dark bi bi-chevron-left"></button>
                </div>
                <div class="col-10">
                    <img id="imgPreview" height="400" width="100%">
                    <div class="my-2 fw-bold text-center" id="details">
                     </div>
                </div>
                <div class="col-1 d-flex flex-column justify-content-center align-items-center">
                    <button onclick="NextClick()" class="btn btn-dark bi bi-chevron-right"></button>
                </div>
            </div>
        </div>
    </div>
    <div class="alert col w-25  overflow-auto alert-success alert-dismissible">
        <h5>Instructions</h5>
        <button class="btn btn-close" data-bs-dismiss="alert"></button>
        <ul class="list-group p-3" id="instructions">

        </ul>
    </div>
</body>

</html>
