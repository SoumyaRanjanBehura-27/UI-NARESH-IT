<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Contact Number</title>
     <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script type="text/javascript">
        var pattern=/^$/;
        var tip="select yoyr country name";
        function countrychange(){
            var countryname=document.getElementById("countrychange").value;
            var imgposter=document.getElementById("imgposter");
            if(countryname==="INDIA"){
               imgposter.src="../public/images/ind.png";
               pattern=/^\+91\d{10}$/;
               tip="india mobile code +91 and 10 digits";
            }else if(countryname==="USA"){
              imgposter.src="../public/images/usa.png";  
              pattern=/^\+\(1\)\(\d{3}\)\(\d{3}\)\s\d{3}-\d{4}$/
              tip="US mobile code +(1)(000) 000-0000";
            }else if(countryname==="UNITED KINGDOM"){
                 imgposter.src="../public/images/uk.webp";  
                 pattern=/^\+\(44\)\(00\)\s \d{4}\s\d{4}$/;
                 tip="UK mobile code +(44)(00) 0000 0000";
            }else{
                imgposter.src="";
                imgposter.alt="N/A";
                pattern=//;
                tip="please select your country";
            }
             document.getElementById("txtnum").placeholder=tip;
        }
        function verifyclick(){
        var mobilenumber =document.getElementById("txtnum").value;
        var lblmobile=document.getElementById("lblmobile");
        if(mobilenumber.match(pattern)){
            document.write(`<h1>your mobile number${mobilenumber}verified successfully</h1>`)
        }else{
            lblmobile.innerHTML=`invalid mobile number <br> ${tip}`.fontcolor('red').fontsize(2);
        }
        }

    </script>
</head>
<body class="container-fluid d-flex justify-content-center" style="margin-top: 200px;">
    <div class="card w-25 p-3 mt-4">
        <dl class="w-100">
            <dt>Select Your Country</dt>
            <dd class="input-group mt-3">
                <select class="form-select" id="countrychange" onchange="countrychange()">
                    <option>select coutry</option>
                    <option>INDIA</option>
                    <option>USA</option>
                    <option>UNITED KINGDOM</option>
                </select>
                <img class="input-group-text" width="70" id="imgposter">
            </dd>
            <dt>Enter Mobile Number</dt>
            <dd>
                <input type=text class="form-control mt-2" id="txtnum">
            </dd>
            <dd id="lblmobile"></dd>
        </dl>
        <button class="btn btn-primary" onclick="verifyclick()">Verify</button>
    </div>
</body>
</html>
